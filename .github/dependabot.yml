# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# NOTE: this repo is Bun-only — bun.lock is the authoritative lockfile. Dependabot's npm
# ecosystem reads package.json manifests (it does not understand bun.lock), so PRs bump
# package.json ranges; `bun install` regenerates bun.lock to match on merge.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase-if-necessary
    groups:
      npm-dependencies:
        patterns:
          - "*"
